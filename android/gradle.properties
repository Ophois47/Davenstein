# Keep Android Build Behavior Reproducible Between Developer Machines And CI
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

# Keep Android Platform Versions Centralized For Routine Toolchain Updates
davenstein.compileSdkMajor=36
davenstein.compileSdkMinor=1
davenstein.targetSdk=36
davenstein.minSdk=26
davenstein.buildToolsVersion=36.0.0
davenstein.ndkVersion=30.0.15729638

# Build The Emulator ABI By Default; Release Automation Will Supply Both ABIs
davenstein.abis=x86_64