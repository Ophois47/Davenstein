[target.armv7-unknown-linux-gnueabihf]
pre-build = [
  "dpkg --add-architecture armhf && apt-get update && apt-get install -y --no-install-recommends pkg-config libwayland-dev:armhf libasound2-dev:armhf libudev-dev:armhf && rm -rf /var/lib/apt/lists/*"
]

[target.aarch64-unknown-linux-gnu]
pre-build = [
  "dpkg --add-architecture arm64 && apt-get update && apt-get install -y --no-install-recommends pkg-config libwayland-dev:arm64 libasound2-dev:arm64 libudev-dev:arm64 libx11-dev:arm64 libxcursor-dev:arm64 libxi-dev:arm64 libxkbcommon-dev:arm64 libxrandr-dev:arm64 && rm -rf /var/lib/apt/lists/*"
]

# The cross-rs 0.2.5 RISC-V image predates the linker and loader fixes
# required by current Rust releases, so this target uses the maintained image
# while the existing proven targets remain on their current build paths.
# The maintained image is based on Ubuntu 24.04, but its Ubuntu Ports source
# does not enable RISC-V packages, so this target adds the matching Noble
# repository before installing the target-architecture Bevy platform libraries.
[target.riscv64gc-unknown-linux-gnu]
image = "ghcr.io/cross-rs/riscv64gc-unknown-linux-gnu:main"
pre-build = [
  "dpkg --add-architecture riscv64 && printf 'Types: deb\nURIs: http://ports.ubuntu.com/ubuntu-ports\nSuites: noble noble-updates noble-backports noble-security\nArchitectures: riscv64\nComponents: main restricted universe multiverse\nSigned-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\n' > /etc/apt/sources.list.d/ubuntu-riscv64.sources && apt-get update && apt-get install -y --no-install-recommends pkg-config libwayland-dev:riscv64 libasound2-dev:riscv64 libudev-dev:riscv64 libx11-dev:riscv64 libxcursor-dev:riscv64 libxi-dev:riscv64 libxkbcommon-dev:riscv64 libxrandr-dev:riscv64 && rm -rf /var/lib/apt/lists/*"
]

# Use The Maintained Windows GNU Image Because The Cross 0.2.5 Image Contains
# GNU Binutils Older Than 2.40 And Cannot Process Rust's -exclude-symbols
# COFF Directives, Which Can Overflow The Windows Export Ordinal Table
[target.x86_64-pc-windows-gnu]
image = "ghcr.io/cross-rs/x86_64-pc-windows-gnu:main"

# The modern cross-rs image supplies a FreeBSD 13 amd64 sysroot and helper
# scripts that unpack official FreeBSD packages into that sysroot. The package
# helper does not recursively install dependencies, so every library proven
# necessary by the Bevy platform stack is listed explicitly:
# - alsa-lib supplies CPAL and Rodio audio support.
# - libepoll-shim and libffi satisfy the Wayland client dependency chain.
# - libudev-devd supplies FreeBSD device discovery for GilRs gamepad support.
# - wayland supplies the native Wayland client libraries and metadata.
[target.x86_64-unknown-freebsd]
image = "ghcr.io/cross-rs/x86_64-unknown-freebsd:main"
pre-build = [
  "export FREEBSD_MIRROR=$(/freebsd-fetch-best-mirror.sh) && /freebsd-setup-packagesite.sh && /freebsd-install-package.sh alsa-lib libepoll-shim libffi libudev-devd wayland"
]

# The Maintained Cross i686 Image Provides The Compiler And glibc Sysroot
# But Not The Native Bevy Platform Libraries. The Preparation Script
# Installs And Validates The Matching i386 Multiarch Development Packages
[target.i686-unknown-linux-gnu]
image = "ghcr.io/cross-rs/i686-unknown-linux-gnu:main"
pre-build = "./scripts/cross_prepare_i686.sh"

# The Maintained Cross PowerPC64LE Image Provides The Compiler And glibc
# Sysroot But Not The Native Bevy Platform Libraries. The Preparation Script
# Extracts The ppc64el Package Payloads Without Installing Foreign glibc
[target.powerpc64le-unknown-linux-gnu]
image = "ghcr.io/cross-rs/powerpc64le-unknown-linux-gnu:main"
pre-build = "./scripts/cross_prepare_powerpc64le.sh"
