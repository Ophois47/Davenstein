name: Build Davenstein Releases

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: Build only the selected platform during manual runs
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - windows-arm64
          - windows-i686
          - linux-x86_64
          - linux-i686
          - linux-arm64
          - linux-armv7
          - linux-riscv64
          - linux-powerpc64le
          - rpm-x86_64
          - flatpak-x86_64
          - flatpak-arm64
          - flatpak-all
          - freebsd-x86_64
          - android-arm64
          - macos-arm64
          - macos-intel
          - macos-universal
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  release-preflight:
    name: Validate Release Version
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}

    steps:
      - name: Check Out Source
        uses: actions/checkout@v7

      # Cargo.toml is the version authority for manual builds. Tagged builds
      # must use the same version so package contents, metadata, and filenames
      # cannot disagree with the GitHub release tag.
      - name: Resolve and Validate Release Version
        id: version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          cargo_version=$(
            python3 - <<'PY'
          import pathlib
          import tomllib

          manifest_path = pathlib.Path("Cargo.toml")
          with manifest_path.open("rb") as manifest_file:
              manifest = tomllib.load(manifest_file)

          package = manifest.get("package")
          if not isinstance(package, dict):
              raise SystemExit("Cargo.toml does not contain a [package] table")

          version = package.get("version")
          if not isinstance(version, str) or not version.strip():
              raise SystemExit("Cargo.toml does not contain a non-empty [package].version")

          print(version)
          PY
          )

          release_version="$cargo_version"

          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ "$REF_NAME" != v* ]]; then
              echo "::error title=Invalid release tag::Expected a tag beginning with v, received '$REF_NAME'"
              exit 1
            fi

            tag_version="${REF_NAME#v}"

            if [[ -z "$tag_version" ]]; then
              echo "::error title=Invalid release tag::The release tag does not contain a version after v"
              exit 1
            fi

            if [[ "$tag_version" != "$cargo_version" ]]; then
              echo "::error title=Release version mismatch::Git tag '$REF_NAME' specifies '$tag_version', but Cargo.toml specifies '$cargo_version'"
              exit 1
            fi

            release_version="$tag_version"
          fi

          printf 'release_version=%s\n' "$release_version" >> "$GITHUB_OUTPUT"
          echo "Validated Davenstein release version $release_version"

  build-android-arm64:
    name: Build Android ARM64 APK
    if: github.event_name == 'push' || inputs.build_target == 'all' || inputs.build_target == 'android-arm64'
    needs: release-preflight
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ needs.release-preflight.outputs.release_version }}

      # Keep Android CI Tooling Centralized And Straightforward To Update
      ANDROID_JAVA_VERSION: "21"
      ANDROID_RUST_TARGET: aarch64-linux-android
      ANDROID_RELEASE_ABI: arm64-v8a
      ANDROID_COMMAND_LINE_TOOLS_VERSION: "14742923"
      CARGO_NDK_VERSION: 4.1.2

    steps:
      # Build Android From The Exact Source Revision Used By Every Other
      # Package In The Main Release Workflow
      - name: Check Out Source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.ANDROID_JAVA_VERSION }}
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties

      # Read Android Platform Versions From The Committed Gradle Properties
      # Instead Of Maintaining A Second Independent Version List In CI
      - name: Resolve Android Toolchain Versions
        shell: bash
        run: |
          set -euo pipefail

          read_property() {
            local key="$1"
            local count
            local value

            count=$(
              awk \
                -F= \
                -v key="$key" \
                '$1 == key { count++ } END { print count + 0 }' \
                android/gradle.properties
            )

            if [[ "$count" -ne 1 ]]; then
              printf \
                'Expected exactly one %s property, found %s\n' \
                "$key" \
                "$count" >&2
              exit 1
            fi

            value=$(
              awk \
                -F= \
                -v key="$key" \
                '$1 == key {
                  sub(/^[^=]*=/, "")
                  print
                }' \
                android/gradle.properties
            )

            if [[ -z "$value" ]]; then
              printf 'Android property %s is empty\n' "$key" >&2
              exit 1
            fi

            printf '%s' "$value"
          }

          compile_sdk_major=$(
            read_property davenstein.compileSdkMajor
          )
          compile_sdk_minor=$(
            read_property davenstein.compileSdkMinor
          )
          build_tools_version=$(
            read_property davenstein.buildToolsVersion
          )
          ndk_version=$(
            read_property davenstein.ndkVersion
          )
          minimum_sdk=$(
            read_property davenstein.minSdk
          )

          if [[ "$compile_sdk_minor" == "0" ]]; then
            platform_version="$compile_sdk_major"
          else
            platform_version="${compile_sdk_major}.${compile_sdk_minor}"
          fi

          {
            printf \
              'ANDROID_PLATFORM_PACKAGE=platforms;android-%s\n' \
              "$platform_version"
            printf \
              'ANDROID_BUILD_TOOLS_PACKAGE=build-tools;%s\n' \
              "$build_tools_version"
            printf \
              'ANDROID_NDK_PACKAGE=ndk;%s\n' \
              "$ndk_version"
            printf \
              'ANDROID_BUILD_TOOLS_VERSION=%s\n' \
              "$build_tools_version"
            printf \
              'ANDROID_NDK_VERSION=%s\n' \
              "$ndk_version"
            printf \
              'ANDROID_MIN_SDK=%s\n' \
              "$minimum_sdk"
          } >> "$GITHUB_ENV"

          printf 'Android Platform: %s\n' "$platform_version"
          printf 'Android Build Tools: %s\n' "$build_tools_version"
          printf 'Android NDK: %s\n' "$ndk_version"
          printf 'Android Minimum API: %s\n' "$minimum_sdk"

      - name: Set Up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: ${{ env.ANDROID_COMMAND_LINE_TOOLS_VERSION }}
          packages: ""
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Pinned Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            platform-tools \
            "$ANDROID_PLATFORM_PACKAGE" \
            "$ANDROID_BUILD_TOOLS_PACKAGE" \
            "$ANDROID_NDK_PACKAGE"

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [[ -z "$sdk_root" ]]; then
            echo "Android SDK root is unavailable" >&2
            exit 1
          fi

          ndk_root="$sdk_root/ndk/$ANDROID_NDK_VERSION"
          build_tools_dir="$sdk_root/build-tools/$ANDROID_BUILD_TOOLS_VERSION"

          test -d "$ndk_root"
          test -x "$build_tools_dir/aapt"
          test -x "$build_tools_dir/apksigner"
          test -x "$build_tools_dir/zipalign"

          {
            printf 'ANDROID_NDK_HOME=%s\n' "$ndk_root"
            printf 'ANDROID_NDK_ROOT=%s\n' "$ndk_root"
            printf 'ANDROID_BUILD_TOOLS_DIR=%s\n' "$build_tools_dir"
          } >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.ANDROID_RUST_TARGET }}

      - name: Install cargo-ndk
        shell: bash
        run: |
          set -euo pipefail

          cargo install \
            cargo-ndk \
            --version "$CARGO_NDK_VERSION"

          cargo ndk --version

      - name: Install Android Validation Tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            file \
            unzip

      # Build The Same DVPK Asset Package Used By Desktop Releases, Then Stage
      # It In The Android Asset Directory Expected By The Gradle Source Set
      - name: Build And Stage Android Assets
        shell: bash
        run: |
          set -euo pipefail

          rm -rf target/android-assets
          mkdir -p target/release target/android-assets

          rustc \
            --edition=2024 \
            -O \
            src/pak_builder.rs \
            -o target/release/pak_builder

          target/release/pak_builder \
            --root assets \
            --out target/android-assets/assets.pak

          pak_hash=$(
            sha256sum target/android-assets/assets.pak |
              awk '{ print tolower($1) }'
          )

          printf '%s\n' "$pak_hash" \
            > target/android-assets/assets.pak.sha256

          test -s target/android-assets/assets.pak
          grep -Eq \
            '^[0-9a-f]{64}$' \
            target/android-assets/assets.pak.sha256

          printf 'Android assets.pak SHA-256: %s\n' "$pak_hash"

      # Compile Only The Public ARM64 Android ABI While Leaving The Emulator
      # Default In gradle.properties Unchanged For Developer Builds
      - name: Build Davenstein Android ARM64 Library
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "target/android-jniLibs/$ANDROID_RELEASE_ABI"

          cargo ndk \
            -t "$ANDROID_RELEASE_ABI" \
            -P "$ANDROID_MIN_SDK" \
            -o target/android-jniLibs \
            build \
            --release \
            --lib

      - name: Validate Android ARM64 Library
        shell: bash
        run: |
          set -euo pipefail

          native_library="target/android-jniLibs/$ANDROID_RELEASE_ABI/libdavelib.so"
          elf_header="$RUNNER_TEMP/davenstein-android-elf-header.txt"

          test -s "$native_library"

          file "$native_library"
          readelf -h "$native_library" |
            tee "$elf_header"

          grep -Eq \
            'Class:[[:space:]]+ELF64' \
            "$elf_header"

          grep -Eq \
            'Machine:[[:space:]]+AArch64' \
            "$elf_header"

      # Require Every Loadable ELF Segment To Support 16 KiB Page Boundaries
      # Before The Native Library Is Accepted For Public Android Packaging
      - name: Validate Android ARM64 Page Alignment
        shell: bash
        run: |
          set -euo pipefail

          native_library="target/android-jniLibs/$ANDROID_RELEASE_ABI/libdavelib.so"

          mapfile -t load_alignments < <(
            readelf -lW "$native_library" |
              awk '$1 == "LOAD" { print $NF }'
          )

          if [[ "${#load_alignments[@]}" -eq 0 ]]; then
            echo "No ELF LOAD segments were found" >&2
            exit 1
          fi

          for alignment in "${load_alignments[@]}"; do
            alignment_value=$((alignment))

            if (
              ((
                alignment_value < 0x4000 ||
                alignment_value % 0x4000 != 0
              ))
            ); then
              printf \
                'ELF LOAD alignment %s does not support 16 KiB pages\n' \
                "$alignment" >&2
              exit 1
            fi
          done

          printf 'Validated ELF LOAD Alignments: %s\n' \
            "${load_alignments[*]}"

      - name: Build Unsigned Android Release APK
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android/app/build/outputs/apk/release

          chmod +x android/gradlew

          (
            cd android

            ./gradlew \
              --no-daemon \
              --stacktrace \
              "-Pdavenstein.abis=$ANDROID_RELEASE_ABI" \
              app:assembleRelease
          )

          mapfile -t unsigned_apks < <(
            find android/app/build/outputs/apk/release \
              -maxdepth 1 \
              -type f \
              -name '*-unsigned.apk' \
              -print
          )

          if [[ "${#unsigned_apks[@]}" -ne 1 ]]; then
            printf \
              'Expected one unsigned Android APK, found %s\n' \
              "${#unsigned_apks[@]}" >&2
            exit 1
          fi

          test -s "${unsigned_apks[0]}"

          printf 'ANDROID_UNSIGNED_APK_PATH=%s\n' \
            "${unsigned_apks[0]}" \
            >> "$GITHUB_ENV"

      # Reconstruct Only A Temporary Runner Copy Of The Permanent Signing
      # Identity And Verify It Before Any APK Signing Operation Is Allowed
      - name: Configure Temporary Android Signing Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          EXPECTED_KEYSTORE_SHA256: ${{ vars.ANDROID_KEYSTORE_SHA256 }}
        run: |
          set -euo pipefail

          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "ANDROID_KEYSTORE_BASE64 is unavailable" >&2
            exit 1
          fi

          if [[ -z "$EXPECTED_KEYSTORE_SHA256" ]]; then
            echo "ANDROID_KEYSTORE_SHA256 is unavailable" >&2
            exit 1
          fi

          keystore="$RUNNER_TEMP/Davenstein-Android-Release.p12"

          printf '%s' "$KEYSTORE_BASE64" |
            base64 --decode \
              > "$keystore"

          chmod 600 "$keystore"

          actual_hash=$(
            sha256sum "$keystore" |
              awk '{ print tolower($1) }'
          )

          expected_hash=$(
            printf '%s' "$EXPECTED_KEYSTORE_SHA256" |
              tr '[:upper:]' '[:lower:]'
          )

          if [[ "$actual_hash" != "$expected_hash" ]]; then
            echo "Temporary Android keystore checksum mismatch" >&2
            exit 1
          fi

          printf 'ANDROID_KEYSTORE_PATH=%s\n' "$keystore" \
            >> "$GITHUB_ENV"

          printf 'Verified Android Keystore SHA-256: %s\n' \
            "$actual_hash"

      # Align The Native Library For 16 KiB Devices Before Signing Because Any
      # Post-Signature APK Modification Would Invalidate The Android Signature
      - name: Align And Sign Android Release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [[ -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "ANDROID_KEYSTORE_PASSWORD is unavailable" >&2
            exit 1
          fi

          if [[ -z "$ANDROID_KEY_ALIAS" ]]; then
            echo "ANDROID_KEY_ALIAS is unavailable" >&2
            exit 1
          fi

          output_directory="target/release-artifacts/android"
          aligned_apk="$RUNNER_TEMP/Davenstein-Android-aligned.apk"
          signed_apk="$output_directory/Davenstein-${RELEASE_VERSION}-Android-${ANDROID_RELEASE_ABI}.apk"
          checksum_path="${signed_apk}.sha256"

          rm -rf "$output_directory"
          mkdir -p "$output_directory"

          "$ANDROID_BUILD_TOOLS_DIR/zipalign" \
            -P 16 \
            -f \
            -v \
            4 \
            "$ANDROID_UNSIGNED_APK_PATH" \
            "$aligned_apk"

          "$ANDROID_BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$ANDROID_KEYSTORE_PATH" \
            --ks-type PKCS12 \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --v4-signing-enabled false \
            --out "$signed_apk" \
            "$aligned_apk"

          test -s "$signed_apk"

          {
            printf 'ANDROID_APK_PATH=%s\n' "$signed_apk"
            printf 'ANDROID_APK_CHECKSUM_PATH=%s\n' "$checksum_path"
          } >> "$GITHUB_ENV"

      # Confirm The APK Uses The Permanent Davenstein Certificate Rather Than
      # Merely Accepting Any Cryptographically Valid Android Signature
      - name: Verify Signed Android Release APK
        shell: bash
        env:
          EXPECTED_CERTIFICATE_SHA256: ${{ vars.ANDROID_CERTIFICATE_SHA256 }}
        run: |
          set -euo pipefail

          if [[ -z "$EXPECTED_CERTIFICATE_SHA256" ]]; then
            echo "ANDROID_CERTIFICATE_SHA256 is unavailable" >&2
            exit 1
          fi

          signature_report="$RUNNER_TEMP/davenstein-android-signature.txt"
          badging_report="$RUNNER_TEMP/davenstein-android-badging.txt"

          "$ANDROID_BUILD_TOOLS_DIR/zipalign" \
            -c \
            -P 16 \
            -v \
            4 \
            "$ANDROID_APK_PATH"

          "$ANDROID_BUILD_TOOLS_DIR/apksigner" verify \
            --verbose \
            --print-certs \
            --min-sdk-version "$ANDROID_MIN_SDK" \
            "$ANDROID_APK_PATH" |
            tee "$signature_report"

          actual_certificate=$(
            awk \
              -F': ' \
              '/Signer #1 certificate SHA-256 digest:/ {
                print $2
                exit
              }' \
              "$signature_report" |
              sed 's/://g' |
              tr -d '[:space:]' |
              tr '[:lower:]' '[:upper:]'
          )

          expected_certificate=$(
            printf '%s' "$EXPECTED_CERTIFICATE_SHA256" |
              sed 's/://g' |
              tr -d '[:space:]' |
              tr '[:lower:]' '[:upper:]'
          )

          if [[ -z "$actual_certificate" ]]; then
            echo "Could not read the APK signing certificate" >&2
            exit 1
          fi

          if [[ "$actual_certificate" != "$expected_certificate" ]]; then
            echo "Android signing certificate fingerprint mismatch" >&2
            printf 'Expected: %s\n' "$expected_certificate" >&2
            printf 'Actual:   %s\n' "$actual_certificate" >&2
            exit 1
          fi

          "$ANDROID_BUILD_TOOLS_DIR/aapt" dump badging \
            "$ANDROID_APK_PATH" |
            tee "$badging_report"

          grep -Fq \
            "package: name='com.davidpetnick.davenstein'" \
            "$badging_report"

          grep -Fq \
            "versionName='${RELEASE_VERSION}'" \
            "$badging_report"

          printf 'Verified Android Certificate SHA-256: %s\n' \
            "$actual_certificate"

      - name: Validate Android Release APK Contents
        shell: bash
        run: |
          set -euo pipefail

          apk_entries="$RUNNER_TEMP/davenstein-android-apk-entries.txt"
          extracted_directory="$RUNNER_TEMP/davenstein-android-apk"

          unzip -Z1 "$ANDROID_APK_PATH" |
            tee "$apk_entries"

          grep -Fxq \
            "lib/$ANDROID_RELEASE_ABI/libdavelib.so" \
            "$apk_entries"

          native_entry_count=$(
            grep -Ec '^lib/' "$apk_entries" || true
          )

          if [[ "$native_entry_count" -ne 1 ]]; then
            printf \
              'Expected one packaged native library, found %s\n' \
              "$native_entry_count" >&2
            exit 1
          fi

          grep -Fxq \
            "assets/assets.pak" \
            "$apk_entries"

          grep -Fxq \
            "assets/assets.pak.sha256" \
            "$apk_entries"

          rm -rf "$extracted_directory"
          mkdir -p "$extracted_directory"

          unzip -p \
            "$ANDROID_APK_PATH" \
            "assets/assets.pak" \
            > "$extracted_directory/assets.pak"

          unzip -p \
            "$ANDROID_APK_PATH" \
            "assets/assets.pak.sha256" \
            > "$extracted_directory/assets.pak.sha256"

          unzip -p \
            "$ANDROID_APK_PATH" \
            "lib/$ANDROID_RELEASE_ABI/libdavelib.so" \
            > "$extracted_directory/libdavelib.so"

          expected_pak_hash=$(
            tr -d '\r\n' \
              < "$extracted_directory/assets.pak.sha256"
          )

          actual_pak_hash=$(
            sha256sum "$extracted_directory/assets.pak" |
              awk '{ print tolower($1) }'
          )

          if [[ ! "$expected_pak_hash" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "Packaged Android PAK checksum is invalid" >&2
            exit 1
          fi

          if [[ "${expected_pak_hash,,}" != "$actual_pak_hash" ]]; then
            echo "Packaged Android assets.pak checksum mismatch" >&2
            exit 1
          fi

          file "$extracted_directory/libdavelib.so"

          readelf -h "$extracted_directory/libdavelib.so" |
            tee "$RUNNER_TEMP/davenstein-packaged-android-elf-header.txt"

          grep -Eq \
            'Class:[[:space:]]+ELF64' \
            "$RUNNER_TEMP/davenstein-packaged-android-elf-header.txt"

          grep -Eq \
            'Machine:[[:space:]]+AArch64' \
            "$RUNNER_TEMP/davenstein-packaged-android-elf-header.txt"

      - name: Create Android Release Checksum
        shell: bash
        run: |
          set -euo pipefail

          artifact_directory=$(
            dirname "$ANDROID_APK_PATH"
          )

          apk_name=$(
            basename "$ANDROID_APK_PATH"
          )

          checksum_name=$(
            basename "$ANDROID_APK_CHECKSUM_PATH"
          )

          (
            cd "$artifact_directory"

            sha256sum "$apk_name" \
              > "$checksum_name"

            sha256sum --check "$checksum_name"
          )

      - name: Upload Android ARM64 Package
        uses: actions/upload-artifact@v7
        with:
          name: Davenstein-Android-ARM64-Packages
          path: target/release-artifacts/android/*
          if-no-files-found: error

      - name: Remove Temporary Android Signing Keystore
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/Davenstein-Android-Release.p12"

  build-windows:
    name: Build Windows Installer
    if: github.event_name == 'push' || inputs.build_target == 'all' || inputs.build_target == 'windows'
    needs: release-preflight
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.release-preflight.outputs.release_version }}

    steps:
      - name: Check Out Source
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Validate Windows GNU Toolchain
        shell: bash
        run: |
          image=$(
            awk '
              /^\[target\.x86_64-pc-windows-gnu\]$/ {
                in_target = 1
                next
              }

              /^\[/ {
                in_target = 0
              }

              in_target && /^image = / {
                gsub(/^image = "/, "")
                gsub(/"$/, "")
                print
                exit
              }
            ' Cross.toml
          )

          test -n "$image"

          docker pull "$image"

          toolchain_output=$(
            docker run --rm \
              --entrypoint /bin/sh \
              "$image" \
              -c '
                x86_64-w64-mingw32-ld --version
                x86_64-w64-mingw32-gcc --version
              '
          )

          printf "%s\n" "$toolchain_output"

          linker_version=$(
            printf "%s\n" "$toolchain_output" |
              awk 'NR == 1 { print $NF }'
          )

          minimum_version=2.40
          oldest_version=$(
            printf "%s\n" \
              "$minimum_version" \
              "$linker_version" |
              sort -V |
              head -n 1
          )

          printf "Windows GNU Linker Version: %s\n" "$linker_version"

          test "$oldest_version" = "$minimum_version"

      - name: Build Davenstein for Windows
        run: cross build --release --target x86_64-pc-windows-gnu --bin Davenstein

      - name: Build Asset Packer
        run: |
          mkdir -p target/release
          rustc --edition=2024 -O src/pak_builder.rs -o target/release/pak_builder

      - name: Build Assets
        run: ./target/release/pak_builder --root assets --out assets.pak

      - name: Install Windows Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nsis unzip zip

      - name: Stage Installer Payload
        run: |
          rm -rf packaging/windows/payload
          mkdir -p packaging/windows/payload
          cp target/x86_64-pc-windows-gnu/release/Davenstein.exe packaging/windows/payload/
          cp assets.pak packaging/windows/payload/
          cp README.md packaging/windows/payload/
          cp \
            LICENSE.md \
            LICENSE-MIT \
            LICENSE-APACHE \
            COPYRIGHT.md \
            THIRD_PARTY_ASSETS.md \
            packaging/windows/payload/

      - name: Build Installer
        working-directory: packaging/windows
        run: makensis "-DVERSION=${{ env.RELEASE_VERSION }}" installer.nsi

      - name: Build Windows Portable Archive
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
        run: packaging/windows/build-portable.sh

      - name: Validate Windows Portable Archive
        shell: bash
        run: |
          archive=$(find target/portable \
            -maxdepth 1 \
            -type f \
            -name 'Davenstein-*-windows-x86_64-portable.zip' \
            -print \
            -quit)

          test -n "$archive"
          test -f "$archive.sha256"

          (
            cd target/portable
            sha256sum --check "$(basename "$archive.sha256")"
          )

          extract_dir="$RUNNER_TEMP/davenstein-windows-x86_64"

          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"

          unzip -q "$archive" -d "$extract_dir"

          package_root=$(find "$extract_dir" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -print \
            -quit)

          test -n "$package_root"

          for name in \
            Davenstein.exe \
            assets.pak \
            README.md \
            LICENSE.md \
            LICENSE-MIT \
            LICENSE-APACHE \
            COPYRIGHT.md \
            THIRD_PARTY_ASSETS.md \
            Davenstein.ico \
            portable.flag
          do
            test -e "$package_root/$name"
          done

          test -s "$package_root/Davenstein.exe"
          test -s "$package_root/assets.pak"

          file "$package_root/Davenstein.exe"
          file "$package_root/Davenstein.exe" |
            grep -Eiq 'PE32\+.*x86-64'

      - name: Create Checksum
        working-directory: packaging/windows
        run: |
          sha256sum "Davenstein-Setup-${{ env.RELEASE_VERSION }}.exe" \
            > "Davenstein-Setup-${{ env.RELEASE_VERSION }}.exe.sha256"

      - name: Stage Windows Release Packages
        run: |
          rm -rf target/release-artifacts/windows
          mkdir -p target/release-artifacts/windows
          cp packaging/windows/Davenstein-Setup-*.exe target/release-artifacts/windows/
          cp packaging/windows/Davenstein-Setup-*.exe.sha256 target/release-artifacts/windows/
          cp target/portable/Davenstein-*-windows-x86_64-portable.zip target/release-artifacts/windows/
          cp target/portable/Davenstein-*-windows-x86_64-portable.zip.sha256 target/release-artifacts/windows/

      - name: Upload Windows Packages
        uses: actions/upload-artifact@v7
        with:
          name: Davenstein-Windows-Packages
          path: target/release-artifacts/windows/*
          if-no-files-found: error

  build-windows-arm64:
    name: Build Windows ARM64 Portable Archive
    if: github.event_name == 'push' || inputs.build_target == 'all' || inputs.build_target == 'windows-arm64'
    needs: release-preflight
    runs-on: windows-11-arm
    env:
      RELEASE_VERSION: ${{ needs.release-preflight.outputs.release_version }}

    steps:
      - name: Check Out Source
        uses: actions/checkout@v7

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-pc-windows-msvc
          rustup default stable
          rustc -vV
          cargo -vV

      - name: Build Davenstein for Windows ARM64
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo build --release --target aarch64-pc-windows-msvc --bin Davenstein

      - name: Validate Windows ARM64 Executable
        shell: pwsh
        run: |
          $headers = & llvm-readobj --file-headers target\aarch64-pc-windows-msvc\release\Davenstein.exe
          $headers

          if (-not ($headers -match "IMAGE_FILE_MACHINE_ARM64")) {
              throw "Davenstein.exe is not a Windows ARM64 executable"
          }

      - name: Build Asset Packer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target\release | Out-Null
          rustc --edition=2024 -O src/pak_builder.rs -o target\release\pak_builder.exe

      - name: Build Assets
        shell: pwsh
        run: |
          & .\target\release\pak_builder.exe `
              --root assets `
              --out target\release\assets.pak

      - name: Build Windows ARM64 Portable Archive
        shell: pwsh
        run: |
          $version = "${{ env.RELEASE_VERSION }}"
          $archiveBase = "Davenstein-$version-windows-arm64"
          $portableRoot = Join-Path $PWD "target\portable"
          $stageDir = Join-Path $portableRoot $archiveBase
          $archivePath = Join-Path $portableRoot "$archiveBase-portable.zip"
          $checksumPath = "$archivePath.sha256"

          Remove-Item -Recurse -Force $stageDir -ErrorAction SilentlyContinue
          Remove-Item -Force $archivePath, $checksumPath -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          Copy-Item target\aarch64-pc-windows-msvc\release\Davenstein.exe (Join-Path $stageDir "Davenstein.exe")
          Copy-Item target\release\assets.pak (Join-Path $stageDir "assets.pak")
          Copy-Item README.md (Join-Path $stageDir "README.md")

          foreach ($name in @(
              "LICENSE.md",
              "LICENSE-MIT",
              "LICENSE-APACHE",
              "COPYRIGHT.md",
              "THIRD_PARTY_ASSETS.md"
          )) {
              Copy-Item $name (Join-Path $stageDir $name)
          }

          Copy-Item packaging\windows\Davenstein.ico (Join-Path $stageDir "Davenstein.ico")
          New-Item -ItemType File -Force -Path (Join-Path $stageDir "portable.flag") | Out-Null

          Compress-Archive `
              -LiteralPath $stageDir `
              -DestinationPath $archivePath `
              -CompressionLevel Optimal

          $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $archivePath)" |
              Set-Content -LiteralPath $checksumPath -Encoding ascii

          Write-Host "Created $archivePath"
          Write-Host "Created $checksumPath"

      - name: Validate Windows ARM64 Portable Archive
        shell: pwsh
        run: |
          $archive = Get-ChildItem target\portable\Davenstein-*-windows-arm64-portable.zip |
              Select-Object -First 1

          if (-not $archive) {
              throw "Windows ARM64 portable archive was not created"
          }

          $extractDir = Join-Path $env:RUNNER_TEMP "davenstein-windows-arm64"
          Remove-Item -Recurse -Force $extractDir -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $extractDir

          $packageRoot = Get-ChildItem $extractDir -Directory | Select-Object -First 1

          foreach ($name in @(
              "Davenstein.exe",
              "assets.pak",
              "README.md",
              "LICENSE.md",
              "LICENSE-MIT",
              "LICENSE-APACHE",
              "COPYRIGHT.md",
              "THIRD_PARTY_ASSETS.md",
              "Davenstein.ico",
              "portable.flag"
          )) {
              if (-not (Test-Path (Join-Path $packageRoot.FullName $name))) {
                  throw "Portable archive is missing $name"
              }
          }

          $hash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = Get-Content "$($archive.FullName).sha256"

          if (-not $checksum.Trim().StartsWith($hash)) {
              throw "Windows ARM64 portable archive checksum does not match"
          }

      - name: Stage Windows ARM64 Release Packages
        shell: pwsh
        run: |
          $output = "target\release-artifacts\windows-arm64"
          Remove-Item -Recurse -Force $output -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          Copy-Item target\portable\Davenstein-*-windows-arm64-portable.zip $output
          Copy-Item target\portable\Davenstein-*-windows-arm64-portable.zip.sha256 $output

      - name: Upload Windows ARM64 Packages
        uses: actions/upload-artifact@v7
        with:
          name: Davenstein-Windows-ARM64-Packages
          path: target/release-artifacts/windows-arm64/*
          if-no-files-found: error

  build-windows-i686:
    name: Build Windows i686 Packages
    if: github.event_name == 'push' || inputs.build_target == 'all' || inputs.build_target == 'windows-i686'
    needs: release-preflight
    runs-on: windows-2022
    env:
      RELEASE_VERSION: ${{ needs.release-preflight.outputs.release_version }}

    steps:
      - name: Check Out Source
        uses: actions/checkout@v7

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable `
              --profile minimal `
              --target i686-pc-windows-msvc

          rustup default stable
          rustc -vV
          cargo -vV

      - name: Validate Windows Packaging Tools
        shell: pwsh
        run: |
          foreach ($name in @(
              "llvm-readobj",
              "makensis"
          )) {
              $command = Get-Command $name -ErrorAction SilentlyContinue

              if (-not $command) {
                  throw "$name is not available on the Windows runner"
              }

              Write-Host "$name Path: $($command.Source)"
          }

          llvm-readobj --version

      - name: Build Davenstein for Windows i686
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          cargo build `
              --release `
              --target i686-pc-windows-msvc `
              --bin Davenstein

      - name: Validate Windows i686 Executable
        shell: pwsh
        run: |
          $binary = "target\i686-pc-windows-msvc\release\Davenstein.exe"

          if (-not (Test-Path -LiteralPath $binary)) {
              throw "Windows i686 Davenstein.exe was not created"
          }

          $headers = & llvm-readobj `
              --file-headers `
              $binary

          if ($LASTEXITCODE -ne 0) {
              throw "llvm-readobj could not inspect Davenstein.exe"
          }

          $headers
          $headerText = $headers -join "`n"

          if ($headerText -notmatch "IMAGE_FILE_MACHINE_I386") {
              throw "Davenstein.exe is not a Windows i686 executable"
          }

          if (
              $headerText -match
              "IMAGE_FILE_MACHINE_AMD64|IMAGE_FILE_MACHINE_ARM64"
          ) {
              throw "Davenstein.exe has an unexpected 64-bit machine type"
          }

          $imports = & llvm-readobj `
              --coff-imports `
              $binary

          if ($LASTEXITCODE -ne 0) {
              throw "llvm-readobj could not inspect Davenstein.exe imports"
          }

          $imports |
              Tee-Object `
                  -FilePath "$env:RUNNER_TEMP\davenstein-i686-imports.txt"

      - name: Build Asset Packer
        shell: pwsh
        run: |
          New-Item `
              -ItemType Directory `
              -Force `
              -Path target\release |
              Out-Null

          rustc `
              --edition=2024 `
              -O `
              src\pak_builder.rs `
              -o target\release\pak_builder.exe

      - name: Build Assets
        shell: pwsh
        run: |
          & .\target\release\pak_builder.exe `
              --root assets `
              --out target\release\assets.pak

      - name: Build Windows i686 Portable Archive
        shell: pwsh
        run: |
          $version = "${{ env.RELEASE_VERSION }}"
          $archiveBase = "Davenstein-$version-windows-i686"
          $portableRoot = Join-Path $PWD "target\portable"
          $stageDir = Join-Path $portableRoot $archiveBase
          $archivePath = Join-Path `
              $portableRoot `
              "$archiveBase-portable.zip"
          $checksumPath = "$archivePath.sha256"

          Remove-Item `
              -Recurse `
              -Force `
              $stageDir `
              -ErrorAction SilentlyContinue

          Remove-Item `
              -Force `
              $archivePath, `
              $checksumPath `
              -ErrorAction SilentlyContinue

          New-Item `
              -ItemType Directory `
              -Force `
              -Path $stageDir |
              Out-Null

          Copy-Item `
              target\i686-pc-windows-msvc\release\Davenstein.exe `
              (Join-Path $stageDir "Davenstein.exe")

          Copy-Item `
              target\release\assets.pak `
              (Join-Path $stageDir "assets.pak")

          Copy-Item `
              README.md `
              (Join-Path $stageDir "README.md")

          foreach ($name in @(
              "LICENSE.md",
              "LICENSE-MIT",
              "LICENSE-APACHE",
              "COPYRIGHT.md",
              "THIRD_PARTY_ASSETS.md"
          )) {
              Copy-Item `
                  $name `
                  (Join-Path $stageDir $name)
          }

          Copy-Item `
              packaging\windows\Davenstein.ico `
              (Join-Path $stageDir "Davenstein.ico")

          New-Item `
              -ItemType File `
              -Force `
              -Path (Join-Path $stageDir "portable.flag") |
              Out-Null

          Compress-Archive `
              -LiteralPath $stageDir `
              -DestinationPath $archivePath `
              -CompressionLevel Optimal

          $hash = (
              Get-FileHash `
                  -LiteralPath $archivePath `
                  -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          "$hash  $(Split-Path -Leaf $archivePath)" |
              Set-Content `
                  -LiteralPath $checksumPath `
                  -Encoding ascii

          Write-Host "Created $archivePath"
          Write-Host "Created $checksumPath"

      - name: Validate Windows i686 Portable Archive
        shell: pwsh
        run: |
          function Assert-I686Executable {
              param(
                  [Parameter(Mandatory)]
                  [string] $Path
              )

              $headers = & llvm-readobj `
                  --file-headers `
                  $Path

              if ($LASTEXITCODE -ne 0) {
                  throw "Could not inspect $Path"
              }

              $headers
              $headerText = $headers -join "`n"

              if ($headerText -notmatch "IMAGE_FILE_MACHINE_I386") {
                  throw "$Path is not a Windows i686 executable"
              }

              if (
                  $headerText -match
                  "IMAGE_FILE_MACHINE_AMD64|IMAGE_FILE_MACHINE_ARM64"
              ) {
                  throw "$Path has an unexpected 64-bit machine type"
              }
          }

          $archive = Get-ChildItem `
              target\portable\Davenstein-*-windows-i686-portable.zip |
              Select-Object -First 1

          if (-not $archive) {
              throw "Windows i686 portable archive was not created"
          }

          $checksumPath = "$($archive.FullName).sha256"

          if (-not (Test-Path -LiteralPath $checksumPath)) {
              throw "Windows i686 portable checksum was not created"
          }

          $hash = (
              Get-FileHash `
                  -LiteralPath $archive.FullName `
                  -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          $checksum = (
              Get-Content `
                  -LiteralPath $checksumPath `
                  -Raw
          ).Trim().ToLowerInvariant()

          if (-not $checksum.StartsWith($hash)) {
              throw "Windows i686 portable checksum does not match"
          }

          $extractDir = Join-Path `
              $env:RUNNER_TEMP `
              "davenstein-windows-i686"

          Remove-Item `
              -Recurse `
              -Force `
              $extractDir `
              -ErrorAction SilentlyContinue

          Expand-Archive `
              -LiteralPath $archive.FullName `
              -DestinationPath $extractDir

          $packageRoot = Get-ChildItem `
              $extractDir `
              -Directory |
              Select-Object -First 1

          if (-not $packageRoot) {
              throw "Windows i686 portable package root is missing"
          }

          foreach ($name in @(
              "Davenstein.exe",
              "assets.pak",
              "README.md",
              "LICENSE.md",
              "LICENSE-MIT",
              "LICENSE-APACHE",
              "COPYRIGHT.md",
              "THIRD_PARTY_ASSETS.md",
              "Davenstein.ico",
              "portable.flag"
          )) {
              $path = Join-Path $packageRoot.FullName $name

              if (-not (Test-Path -LiteralPath $path)) {
                  throw "Portable archive is missing $name"
              }
          }

          if (
              (Get-Item `
                  -LiteralPath (
                      Join-Path $packageRoot.FullName "assets.pak"
                  )
              ).Length -eq 0
          ) {
              throw "Portable archive contains an empty assets.pak"
          }

          Assert-I686Executable `
              -Path (
                  Join-Path $packageRoot.FullName "Davenstein.exe"
              )

      - name: Stage Windows i686 Installer Payload
        shell: pwsh
        run: |
          $payload = "packaging\windows\payload"

          Remove-Item `
              -Recurse `
              -Force `
              $payload `
              -ErrorAction SilentlyContinue

          New-Item `
              -ItemType Directory `
              -Force `
              -Path $payload |
              Out-Null

          Copy-Item `
              target\i686-pc-windows-msvc\release\Davenstein.exe `
              $payload

          Copy-Item `
              target\release\assets.pak `
              $payload

          Copy-Item `
              README.md `
              $payload

          Copy-Item `
              LICENSE.md, `
              LICENSE-MIT, `
              LICENSE-APACHE, `
              COPYRIGHT.md, `
              THIRD_PARTY_ASSETS.md `
              $payload

      - name: Build Windows i686 Installer
        shell: pwsh
        working-directory: packaging/windows
        run: |
          & makensis `
              "/DVERSION=${{ env.RELEASE_VERSION }}" `
              "/DDAVENSTEIN_WIN32=1" `
              installer.nsi

          if ($LASTEXITCODE -ne 0) {
              throw "NSIS could not build the Windows i686 installer"
          }

      - name: Create Windows i686 Installer Checksum
        shell: pwsh
        run: |
          $installer = Get-Item `
              "packaging\windows\Davenstein-Setup-$env:RELEASE_VERSION-windows-i686.exe"

          $checksumPath = "$($installer.FullName).sha256"
          $hash = (
              Get-FileHash `
                  -LiteralPath $installer.FullName `
                  -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          "$hash  $($installer.Name)" |
              Set-Content `
                  -LiteralPath $checksumPath `
                  -Encoding ascii

          Write-Host "Created $checksumPath"

      - name: Validate Windows i686 Installer
        shell: pwsh
        run: |
          function Assert-I686Executable {
              param(
                  [Parameter(Mandatory)]
                  [string] $Path
              )

              $headers = & llvm-readobj `
                  --file-headers `
                  $Path

              if ($LASTEXITCODE -ne 0) {
                  throw "Could not inspect $Path"
              }

              $headers
              $headerText = $headers -join "`n"

              if ($headerText -notmatch "IMAGE_FILE_MACHINE_I386") {
                  throw "$Path is not a Windows i686 executable"
              }

              if (
                  $headerText -match
                  "IMAGE_FILE_MACHINE_AMD64|IMAGE_FILE_MACHINE_ARM64"
              ) {
                  throw "$Path has an unexpected 64-bit machine type"
              }
          }

          $installer = Get-Item `
              "packaging\windows\Davenstein-Setup-$env:RELEASE_VERSION-windows-i686.exe"

          $checksumPath = "$($installer.FullName).sha256"

          if (-not (Test-Path -LiteralPath $checksumPath)) {
              throw "Windows i686 installer checksum is missing"
          }

          $hash = (
              Get-FileHash `
                  -LiteralPath $installer.FullName `
                  -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          $checksum = (
              Get-Content `
                  -LiteralPath $checksumPath `
                  -Raw
          ).Trim().ToLowerInvariant()

          if (-not $checksum.StartsWith($hash)) {
              throw "Windows i686 installer checksum does not match"
          }

          $programFilesX86 = [Environment]::GetFolderPath(
              [Environment+SpecialFolder]::ProgramFilesX86
          )

          if ([string]::IsNullOrWhiteSpace($programFilesX86)) {
              throw "Could not resolve the 32-bit Program Files directory"
          }

          $installDir = Join-Path $programFilesX86 "Davenstein"
          $applicationKeyPath = "Software\Davenstein"
          $uninstallKeyPath = (
              "Software\Microsoft\Windows\CurrentVersion\" +
              "Uninstall\Davenstein"
          )

          $registry32 = [Microsoft.Win32.RegistryKey]::OpenBaseKey(
              [Microsoft.Win32.RegistryHive]::LocalMachine,
              [Microsoft.Win32.RegistryView]::Registry32
          )

          $registry64 = [Microsoft.Win32.RegistryKey]::OpenBaseKey(
              [Microsoft.Win32.RegistryHive]::LocalMachine,
              [Microsoft.Win32.RegistryView]::Registry64
          )

          foreach ($path in @(
              $applicationKeyPath,
              $uninstallKeyPath
          )) {
              $existing32 = $registry32.OpenSubKey($path)
              $existing64 = $registry64.OpenSubKey($path)

              if ($existing32) {
                  $existing32.Close()
                  throw "The clean runner already contains $path in Registry32"
              }

              if ($existing64) {
                  $existing64.Close()
                  throw "The clean runner already contains $path in Registry64"
              }
          }

          if (Test-Path -LiteralPath $installDir) {
              throw "The clean runner already contains $installDir"
          }

          $installProcess = Start-Process `
              -FilePath $installer.FullName `
              -ArgumentList "/S" `
              -Wait `
              -PassThru

          if ($installProcess.ExitCode -ne 0) {
              throw (
                  "Windows i686 installer exited with " +
                  "$($installProcess.ExitCode)"
              )
          }

          foreach ($name in @(
              "Davenstein.exe",
              "assets.pak",
              "README.md",
              "LICENSE.md",
              "LICENSE-MIT",
              "LICENSE-APACHE",
              "COPYRIGHT.md",
              "THIRD_PARTY_ASSETS.md",
              "Davenstein.ico",
              "Uninstall.exe"
          )) {
              $path = Join-Path $installDir $name

              if (-not (Test-Path -LiteralPath $path)) {
                  throw "Installed package is missing $name"
              }
          }

          if (
              Test-Path `
                  -LiteralPath (
                      Join-Path $installDir "portable.flag"
                  )
          ) {
              throw "Installed package unexpectedly contains portable.flag"
          }

          Assert-I686Executable `
              -Path (
                  Join-Path $installDir "Davenstein.exe"
              )

          $applicationKey = $registry32.OpenSubKey(
              $applicationKeyPath
          )

          if (-not $applicationKey) {
              throw "Windows i686 application registry key is missing"
          }

          $registeredInstallDir = [string]$applicationKey.GetValue(
              "InstallDir"
          )

          $applicationKey.Close()

          if (
              -not [string]::Equals(
                  $registeredInstallDir,
                  $installDir,
                  [StringComparison]::OrdinalIgnoreCase
              )
          ) {
              throw "The 32-bit registry installation path is incorrect"
          }

          $uninstallKey = $registry32.OpenSubKey(
              $uninstallKeyPath
          )

          if (-not $uninstallKey) {
              throw "Windows i686 uninstall registry key is missing"
          }

          $registeredLocation = [string]$uninstallKey.GetValue(
              "InstallLocation"
          )

          $registeredVersion = [string]$uninstallKey.GetValue(
              "DisplayVersion"
          )

          $uninstallKey.Close()

          if (
              -not [string]::Equals(
                  $registeredLocation,
                  $installDir,
                  [StringComparison]::OrdinalIgnoreCase
              )
          ) {
              throw "The uninstall registry location is incorrect"
          }

          if ($registeredVersion -ne $env:RELEASE_VERSION) {
              throw "The uninstall registry version is incorrect"
          }

          foreach ($path in @(
              $applicationKeyPath,
              $uninstallKeyPath
          )) {
              $unexpected64 = $registry64.OpenSubKey($path)

              if ($unexpected64) {
                  $unexpected64.Close()
                  throw "$path was incorrectly written to Registry64"
              }
          }

          $startMenuDir = Join-Path `
              $env:ProgramData `
              "Microsoft\Windows\Start Menu\Programs\Davenstein"

          if (-not (Test-Path -LiteralPath $startMenuDir)) {
              throw "The all-users Start Menu directory is missing"
          }

          $registry32.Close()
          $registry64.Close()

          $uninstaller = Join-Path $installDir "Uninstall.exe"

          $uninstallProcess = Start-Process `
              -FilePath $uninstaller `
              -ArgumentList "/S" `
              -Wait `
              -PassThru

          if ($uninstallProcess.ExitCode -ne 0) {
              throw (
                  "Windows i686 uninstaller exited with " +
                  "$($uninstallProcess.ExitCode)"
              )
          }

          for (
              $attempt = 0;
              $attempt -lt 20 -and (
                  Test-Path -LiteralPath $installDir
              );
              $attempt++
          ) {
              Start-Sleep -Milliseconds 500
          }

          if (Test-Path -LiteralPath $installDir) {
              throw "The Windows i686 installation directory remains"
          }

          if (Test-Path -LiteralPath $startMenuDir) {
              throw "The Windows i686 Start Menu directory remains"
          }

          $registry32 = [Microsoft.Win32.RegistryKey]::OpenBaseKey(
              [Microsoft.Win32.RegistryHive]::LocalMachine,
              [Microsoft.Win32.RegistryView]::Registry32
          )

          $registry64 = [Microsoft.Win32.RegistryKey]::OpenBaseKey(
              [Microsoft.Win32.RegistryHive]::LocalMachine,
              [Microsoft.Win32.RegistryView]::Registry64
          )

          foreach ($path in @(
              $applicationKeyPath,
              $uninstallKeyPath
          )) {
              $remaining32 = $registry32.OpenSubKey($path)
              $remaining64 = $registry64.OpenSubKey($path)

              if ($remaining32) {
                  $remaining32.Close()
                  throw "$path remains in Registry32 after uninstall"
              }

              if ($remaining64) {
                  $remaining64.Close()
                  throw "$path remains in Registry64 after uninstall"
              }
          }

          $registry32.Close()
          $registry64.Close()

      - name: Stage Windows i686 Release Packages
        shell: pwsh
        run: |
          $output = "target\release-artifacts\windows-i686"

          Remove-Item `
              -Recurse `
              -Force `
              $output `
              -ErrorAction SilentlyContinue

          New-Item `
              -ItemType Directory `
              -Force `
              -Path $output |
              Out-Null

          Copy-Item `
              target\portable\Davenstein-*-windows-i686-portable.zip `
              $output

          Copy-Item `
              target\portable\Davenstein-*-windows-i686-portable.zip.sha256 `
              $output

          Copy-Item `
              packaging\windows\Davenstein-Setup-*-windows-i686.exe `
              $output

          Copy-Item `
              packaging\windows\Davenstein-Setup-*-windows-i686.exe.sha256 `
              $output

      - name: Upload Windows i686 Packages
        uses: actions/upload-artifact@v7
        with:
          name: Davenstein-Windows-i686-Packages
          path: target/release-artifacts/windows-i686/*
          if-no-files-found: error

  build-linux:
    name: Build Linux x86_64 Packages
    if: github.event_name == 'push' || inputs.build_target == 'all' || inputs.build_target == 'linux-x86_64'
    needs: release-preflight
    runs-on: ubuntu-22.04
    env:
      RELEASE_VERSION: ${{ needs.release-preflight.outputs.release_version }}

    steps:
      - name: Check Out Source
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            dpkg-dev \
            file \
            gzip \
            lintian \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            pkg-config

      - name: Build Davenstein AppImage
        run: |
          VERSION="${{ env.RELEASE_VERSION }}" \
            packaging/linux/build-appimage.sh

      - name: Build Linux Portable Archive
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
        run: packaging/linux/build-portable.sh

      # Reuse the Ubuntu 22.04 x86_64 release binary so the Debian package
      # retains an older Linux ABI baseline instead of inheriting Ubuntu 24.04
      # requirements such as libasound2t64 and glibc 2.39.
      - name: Build Debian Package
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
        run: packaging/debian/build-package.sh

      # Validate the archive as both a standalone Debian artifact and an
      # installed system package. This catches metadata, dependency, layout,
      # permissions, runtime-linking, and package-removal regressions.
      - name: Validate Debian Package
        shell: bash
        run: |
          release_version="${{ env.RELEASE_VERSION }}"
          deb="target/debian/Davenstein-${release_version}-linux-amd64.deb"
          checksum="${deb}.sha256"

          case "$release_version" in
            *-*)
              upstream_version=${release_version%%-*}
              prerelease_version=${release_version#*-}
              expected_debian_version="${upstream_version}~${prerelease_version}-1"
              ;;
            *)
              expected_debian_version="${release_version}-1"
              ;;
          esac

          test -f "$deb"
          test -f "$checksum"

          (
            cd target/debian
            sha256sum --check "$(basename "$checksum")"
          )

          test "$(dpkg-deb --field "$deb" Package)" = "davenstein"
          test "$(dpkg-deb --field "$deb" Version)" = "$expected_debian_version"
          test "$(dpkg-deb --field "$deb" Architecture)" = "amd64"

          depends=$(dpkg-deb --field "$deb" Depends)
          printf 'Debian dependencies: %s\n' "$depends"

          # The Jammy build must retain the traditional libasound2 dependency.
          # Requiring libasound2t64 would unnecessarily restrict the package to
          # newer Ubuntu releases.
          printf '%s\n' "$depends" |
            grep -Eq '(^|, )libasound2 \(>='

          if printf '%s\n' "$depends" |
            grep -Fq 'libasound2t64'
          then
            echo "Debian package unexpectedly requires libasound2t64" >&2
            exit 1
          fi

          libc_requirement=$(
            printf '%s\n' "$depends" |
              sed -n 's/.*libc6 (>= \([^)]*\)).*/\1/p'
          )

          test -n "$libc_requirement"

          # Ubuntu 22.04 provides glibc 2.35. Reject a package whose generated
          # dependency claims a newer ABI, since it would defeat the purpose of
          # building the Debian artifact on the older release runner.
          if ! dpkg --compare-versions "$libc_requirement" le 2.35
          then
            echo "Debian package requires libc6 newer than Ubuntu 22.04" >&2
            exit 1
          fi

          lintian --fail-on error "$deb"

          extract_dir="$RUNNER_TEMP/davenstein-debian-extract"

          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"

          # Inspect the package without installing it first. This verifies
          # the archive layout independently from apt and avoids allowing package
          # manager behavior to conceal a missing or misplaced payload file.
          dpkg-deb --extract "$deb" "$extract_dir"

          for path in \
            usr/games/Davenstein \
            usr/lib/davenstein/Davenstein \
            usr/lib/davenstein/assets.pak \
            usr/share/applications/davenstein.desktop \
            usr/share/icons/hicolor/256x256/apps/davenstein.png \
            usr/share/doc/davenstein/README.md \
            usr/share/doc/davenstein/LICENSE.md \
            usr/share/doc/davenstein/LICENSE-MIT \
            usr/share/doc/davenstein/COPYRIGHT.md \
            usr/share/doc/davenstein/THIRD_PARTY_ASSETS.md \
            usr/share/doc/davenstein/copyright \
            usr/share/doc/davenstein/changelog.Debian.gz \
            usr/share/man/man6/Davenstein.6.gz
          do
            test -e "$extract_dir/$path"
          done

          test -x "$extract_dir/usr/games/Davenstein"
          test -x "$extract_dir/usr/lib/davenstein/Davenstein"
          test -s "$extract_dir/usr/lib/davenstein/assets.pak"
          test ! -e "$extract_dir/usr/bin/Davenstein"
          test ! -e "$extract_dir/usr/lib/davenstein/portable.flag"

          # LICENSE-APACHE is intentionally a relative symbolic link to Debian's
          # canonical Apache-2.0 license. Its target exists only after installation
          # beneath a complete Debian filesystem, so validate the link separately.
          test -L \
            "$extract_dir/usr/share/doc/davenstein/LICENSE-APACHE"

          test "$(
            readlink \
              "$extract_dir/usr/share/doc/davenstein/LICENSE-APACHE"
          )" = "../../common-licenses/Apache-2.0"

          grep -Fx \
            'exec /usr/lib/davenstein/Davenstein "$@"' \
            "$extract_dir/usr/games/Davenstein"

          grep -Fx \
            'Exec=/usr/games/Davenstein' \
            "$extract_dir/usr/share/applications/davenstein.desktop"

          gzip -t \
            "$extract_dir/usr/share/doc/davenstein/changelog.Debian.gz"

          gzip -t \
            "$extract_dir/usr/share/man/man6/Davenstein.6.gz"

          file "$extract_dir/usr/lib/davenstein/Davenstein"
          file "$extract_dir/usr/lib/davenstein/Davenstein" |
            grep -Eiq 'ELF 64-bit.*x86-64.*stripped'

          if ldd "$extract_dir/usr/lib/davenstein/Davenstein" |
            grep -F 'not found'
          then
            echo "Extracted Debian executable has unresolved libraries" >&2
            exit 1
          fi

          # Perform a real apt installation after archive inspection to
          # prove dependency resolution, maintainer metadata, filesystem placement,
          # desktop integration, and installed runtime linking all work together.
          sudo apt-get install -y "$GITHUB_WORKSPACE/$deb"

          test "$(
            dpkg-query -W -f='${db:Status-Status}' davenstein
          )" = "installed"

          test "$(
            dpkg-query -W -f='${Version}' davenstein
          )" = "$expected_debian_version"

          test "$(
            dpkg-query -W -f='${Architecture}' davenstein
          )" = "amd64"

          test -x /usr/games/Davenstein
          test ! -e /usr/bin/Davenstein
          test -x /usr/lib/davenstein/Davenstein
          test -s /usr/lib/davenstein/assets.pak
          test ! -e /usr/lib/davenstein/portable.flag

          test -L /usr/share/doc/davenstein/LICENSE-APACHE
          test -f /usr/share/common-licenses/Apache-2.0

          grep -Fx \
            'Exec=/usr/games/Davenstein' \
            /usr/share/applications/davenstein.desktop

          sh -n /usr/games/Davenstein
          gzip -t /usr/share/doc/davenstein/changelog.Debian.gz
          gzip -t /usr/share/man/man6/Davenstein.6.gz
          dpkg -V davenstein

          if ldd /usr/lib/davenstein/Davenstein |
            grep -F 'not found'
          then
            echo "Installed Debian executable has unresolved libraries" >&2
            exit 1
          fi

          # Remove the package and verify that every owned application file
          # disappears. This guards against stale launchers, assets, documentation,
          # icons, and package directories surviving an uninstall.
          sudo apt-get remove -y davenstein

          for path in \
            /usr/games/Davenstein \
            /usr/bin/Davenstein \
            /usr/lib/davenstein/Davenstein \
            /usr/lib/davenstein/assets.pak \
            /usr/share/applications/davenstein.desktop \
            /usr/share/icons/hicolor/256x256/apps/davenstein.png \
            /usr/share/doc/davenstein \
            /usr/share/man/man6/Davenstein.6.gz
          do
            test ! -e "$path"
          done

          if dpkg-query \
            -W \
            -f='${db:Status-Status}\n' \
            davenstein \
            2>/dev/null |
            grep -qx installed
          then
            echo "Davenstein remains installed after removal" >&2
            exit 1
          fi

      - name: Validate Linux x86_64 Packages
        shell: bash
        run: |
          appimage=$(find target/appimage \
            -maxdepth 1 \
            -type f \
            -name 'Davenstein-*-x86_64.AppImage' \
            -print \
            -quit)

          portable=$(find target/portable \
            -maxdepth 1 \
            -type f \
            -name 'Davenstein-*-linux-x86_64.tar.gz' \
            -print \
            -quit)

          test -n "$appimage"
          test -n "$portable"
          test -f "$appimage.sha256"
          test -f "$portable.sha256"

          (
            cd target/appimage
            sha256sum --check "$(basename "$appimage.sha256")"
          )

          (
            cd target/portable
            sha256sum --check "$(basename "$portable.sha256")"
          )

          appimage_extract="$RUNNER_TEMP/davenstein-linux-x86_64-appimage"
          portable_extract="$RUNNER_TEMP/davenstein-linux-x86_64-portable"

          rm -rf "$appimage_extract" "$portable_extract"
          mkdir -p "$appimage_extract" "$portable_extract"

          (
            cd "$appimage_extract"
            "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null
          )

          appimage_root="$appimage_extract/squashfs-root"

          test -e "$appimage_root/AppRun"
          test -x "$appimage_root/usr/bin/Davenstein"
          test -s "$appimage_root/usr/bin/assets.pak"

          for legal_file in \
            LICENSE.md \
            LICENSE-MIT \
            LICENSE-APACHE \
            COPYRIGHT.md \
            THIRD_PARTY_ASSETS.md
          do
            test -f "$appimage_root/usr/share/doc/davenstein/$legal_file"
          done

          file "$appimage_root/usr/bin/Davenstein"
          file "$appimage_root/usr/bin/Davenstein" |
            grep -Eiq 'ELF 64-bit.*x86-64'

          tar -xzf "$portable" -C "$portable_extract"

          package_root=$(find "$portable_extract" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -print \
            -quit)

          test -n "$package_root"

          for name in \
            Davenstein \
            assets.pak \
            README.md \
            LICENSE.md \
            LICENSE-MIT \
            LICENSE-APACHE \
            COPYRIGHT.md \
            THIRD_PARTY_ASSETS.md \
            davenstein.png \
            portable.flag \
            run-davenstein.sh
          do
            test -e "$package_root/$name"
          done

          test -x "$package_root/Davenstein"
          test -x "$package_root/run-davenstein.sh"
          test -s "$package_root/assets.pak"

          file "$package_root/Davenstein"
          file "$package_root/Davenstein" |
            grep -Eiq 'ELF 64-bit.*x86-64'

      - name: Stage Linux Release Packages
        run: |
          rm -rf target/release-artifacts/linux
          mkdir -p target/release-artifacts/linux
          cp target/appimage/Davenstein-*-x86_64.AppImage target/release-artifacts/linux/
          cp target/appimage/Davenstein-*-x86_64.AppImage.sha256 target/release-artifacts/linux/
          cp target/portable/Davenstein-*-linux-x86_64.tar.gz target/release-artifacts/linux/
          cp target/portable/Davenstein-*-linux-x86_64.tar.gz.sha256 target/release-artifacts/linux/

          # Publish the native Debian package beside the existing x86_64
          # AppImage and portable archive as part of the same Linux artifact.
          cp target/debian/Davenstein-*-linux-amd64.deb target/release-artifacts/linux/
          cp target/debian/Davenstein-*-linux-amd64.deb.sha256 target/release-artifacts/linux/

      - name: Upload Linux Packages
        uses: actions/upload-artifact@v7
        with:
          name: Davenstein-Linux-Packages
          path: target/release-artifacts/linux/*
          if-no-files-found: error

  # Build the RPM from a binary compiled natively on Rocky Linux 9 rather than
  # repackaging the Ubuntu binary used by the other Linux x86_64 artifacts.
  # This preserves an Enterprise Linux 9 runtime baseline for the RPM package.
  build-linux-rpm:
    name: Build Linux x86_64 RPM Package
    if: github.event_name == 'push' || inputs.build_target == 'all' || inputs.build_target == 'linux-x86_64' || inputs.build_target == 'rpm-x86_64'
    needs: release-preflight
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.release-preflight.outputs.release_version }}
    container:
      image: rockylinux:9

    defaults:
      run:
        shell: bash

    steps:
      # Container jobs begin with only the packages supplied by Rocky Linux.
      # Install Git before checkout along with every native build and RPM tool.
      - name: Install Rocky Linux Build Dependencies
        run: |
          set -euxo pipefail

          dnf install -y \
            dnf-plugins-core \
            epel-release

          dnf config-manager --set-enabled crb

          dnf install -y \
            alsa-lib-devel \
            binutils \
            ca-certificates \
            cpio \
            curl-minimal \
            desktop-file-utils \
            file \
            findutils \
            gcc \
            gcc-c++ \
            git \
            gzip \
            hicolor-icon-theme \
            libX11-devel \
            libXcursor-devel \
            libXi-devel \
            libXrandr-devel \
            libxkbcommon-devel \
            make \
            pkgconf-pkg-config \
            redhat-rpm-config \
            rpm-build \
            rpmlint \
            systemd-devel \
            tar \
            wayland-devel \
            which

      - name: Check Out Source
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          set -euxo pipefail

          curl \
            --proto "=https" \
            --tlsv1.2 \
            -sSf \
            https://sh.rustup.rs |
            sh -s -- \
              -y \
              --profile minimal \
              --default-toolchain stable

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          . "$HOME/.cargo/env"

          rustc --version
          cargo --version
          rpmbuild --version
          rpmlint --version

      - name: Build Davenstein for Rocky Linux
        run: |
          cargo build \
            --release \
            --bin Davenstein

      - name: Build Rocky Linux Assets
        run: |
          rustc \
            --edition=2024 \
            -O \
            src/pak_builder.rs \
            -o target/release/pak_builder

          target/release/pak_builder \
            --root assets \
            --out target/release/assets.pak

      - name: Build RPM Package
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
        run: packaging/rpm/build-package.sh

      # Validate the RPM first as an archive, then as an installed package, and
      # finally prove that removal leaves no Davenstein-owned paths behind.
      - name: Validate RPM Package
        run: |
          set -euxo pipefail

          release_version="${{ env.RELEASE_VERSION }}"
          rpm_file="target/rpm/Davenstein-${release_version}-linux-x86_64.rpm"
          checksum="${rpm_file}.sha256"

          test -f "$rpm_file"
          test -f "$checksum"

          (
            cd target/rpm
            sha256sum --check "$(basename "$checksum")"
          )

          test "$(
            rpm -qp \
              --queryformat "%{NAME}" \
              "$rpm_file"
          )" = "davenstein"

          test "$(
            rpm -qp \
              --queryformat "%{VERSION}" \
              "$rpm_file"
          )" = "${release_version%%-*}"

          test "$(
            rpm -qp \
              --queryformat "%{ARCH}" \
              "$rpm_file"
          )" = "x86_64"

          echo "=== RPM metadata ==="

          rpm -qp \
            --queryformat \
            "Name: %{NAME}\nVersion: %{VERSION}\nRelease: %{RELEASE}\nArchitecture: %{ARCH}\nLicense: %{LICENSE}\n" \
            "$rpm_file"

          echo "=== RPM dependencies ==="

          rpm -qpR "$rpm_file" |
            sort

          echo "=== rpmlint ==="

          set +e

          rpmlint "$rpm_file" 2>&1 |
            tee target/rpm/rpmlint.txt

          rpmlint_status=${PIPESTATUS[0]}

          set -e

          printf "rpmlint exit status: %s\n" "$rpmlint_status"

          # Rocky Linux 9's older rpmlint database produces several accepted
          # warnings, but genuine package errors must still fail the workflow.
          if ! grep -Eq '(^|[^0-9])0 errors,' target/rpm/rpmlint.txt
          then
            echo "rpmlint reported one or more RPM package errors" >&2
            exit 1
          fi

          extract_dir="$RUNNER_TEMP/davenstein-rpm-extract"

          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"

          (
            cd "$extract_dir"

            rpm2cpio "$GITHUB_WORKSPACE/$rpm_file" |
              cpio -idm
          )

          test -x "$extract_dir/usr/bin/Davenstein"
          test -x "$extract_dir/usr/libexec/davenstein/Davenstein"
          test -s "$extract_dir/usr/libexec/davenstein/assets.pak"
          test ! -e "$extract_dir/usr/libexec/davenstein/portable.flag"

          test -f \
            "$extract_dir/usr/share/applications/davenstein.desktop"

          test -f \
            "$extract_dir/usr/share/icons/hicolor/256x256/apps/davenstein.png"

          test -f \
            "$extract_dir/usr/share/doc/davenstein/README.md"

          test -f \
            "$extract_dir/usr/share/licenses/davenstein/LICENSE.md"

          test -f \
            "$extract_dir/usr/share/licenses/davenstein/LICENSE-MIT"

          test -f \
            "$extract_dir/usr/share/licenses/davenstein/LICENSE-APACHE"

          test -f \
            "$extract_dir/usr/share/licenses/davenstein/COPYRIGHT.md"

          test -f \
            "$extract_dir/usr/share/licenses/davenstein/THIRD_PARTY_ASSETS.md"

          test -f \
            "$extract_dir/usr/share/man/man6/Davenstein.6.gz"

          grep -Fx \
            'exec /usr/libexec/davenstein/Davenstein "$@"' \
            "$extract_dir/usr/bin/Davenstein"

          grep -Fx \
            'Exec=/usr/bin/Davenstein' \
            "$extract_dir/usr/share/applications/davenstein.desktop"

          sh -n "$extract_dir/usr/bin/Davenstein"

          gzip -t \
            "$extract_dir/usr/share/man/man6/Davenstein.6.gz"

          file "$extract_dir/usr/libexec/davenstein/Davenstein" |
            grep -Eiq 'ELF 64-bit.*x86-64.*stripped'

          if ldd "$extract_dir/usr/libexec/davenstein/Davenstein" |
            grep -F "not found"
          then
            echo "Extracted RPM executable has unresolved libraries" >&2
            exit 1
          fi

          rpm -qpl "$rpm_file" |
            grep -Fx "/usr/share/doc/davenstein"

          rpm -qpl "$rpm_file" |
            grep -Fx "/usr/share/licenses/davenstein"

          dnf install -y "$GITHUB_WORKSPACE/$rpm_file"

          rpm -V davenstein

          test -x /usr/bin/Davenstein
          test -x /usr/libexec/davenstein/Davenstein
          test -s /usr/libexec/davenstein/assets.pak
          test ! -e /usr/libexec/davenstein/portable.flag
          test -d /usr/share/doc/davenstein
          test -d /usr/share/licenses/davenstein

          if ldd /usr/libexec/davenstein/Davenstein |
            grep -F "not found"
          then
            echo "Installed RPM executable has unresolved libraries" >&2
            exit 1
          fi

          dnf remove -y davenstein

          for installed_path in \
            /usr/bin/Davenstein \
            /usr/libexec/davenstein \
            /usr/share/applications/davenstein.desktop \
            /usr/share/icons/hicolor/256x256/apps/davenstein.png \
            /usr/share/doc/davenstein \
            /usr/share/licenses/davenstein \
            /usr/share/man/man6/Davenstein.6.gz
          do
            test ! -e "$installed_path"
          done

          if rpm -q davenstein >/dev/null 2>&1
          then
            echo "Davenstein remains registered after RPM removal" >&2
            exit 1
          fi

      - name: Stage Linux RPM Release Package
        run: |
          rm -rf target/release-artifacts/linux-rpm
          mkdir -p target/release-artifacts/linux-rpm

          cp \
            target/rpm/Davenstein-*-linux-x86_64.rpm \
            target/release-artifacts/linux-rpm/

          cp \
            target/rpm/Davenstein-*-linux-x86_64.rpm.sha256 \
            target/release-artifacts/linux-rpm/

      - name: Upload Linux RPM Package
        uses: actions/upload-artifact@v7
        with:
          name: Davenstein-Linux-RPM-Packages
          path: target/release-artifacts/linux-rpm/*
          if-no-files-found: error

      # Retain the lint report for workflow inspection without publishing it as
      # a downloadable file on tagged GitHub releases.
      - name: Upload RPM Lint Report
        uses: actions/upload-artifact@v7
        with:
          name: RPM-Lint-Report
          path: target/rpm/rpmlint.txt
          if-no-files-found: error

  # Build Flatpak natively because flatpak-builder only supports host-compatible
  # architectures and the Flatpak Rust SDK supplies the compiler used inside
  # the isolated Freedesktop build environment
  #
  # The linux-x86_64 manual selection intentionally runs the existing Ubuntu
  # packages, Rocky Linux RPM package, and this Flatpak package in parallel
  # Dedicated Flatpak selections run this job without the broader Linux jobs
  build-linux-flatpak:
    name: Build Linux x86_64 Flatpak Package
    if: github.event_name == 'push' || inputs.build_target == 'all' || inputs.build_target == 'linux-x86_64' || inputs.build_target == 'flatpak-x86_64' || inputs.build_target == 'flatpak-all'
    needs: release-preflight
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ needs.release-preflight.outputs.release_version }}

    steps:
      - name: Check Out Source
        uses: actions/checkout@v7

      # Install only the host tools needed to construct and validate Flatpak
      # bundles because Rust itself comes from the Flatpak SDK extension
      - name: Install Flatpak Build Dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream \
            desktop-file-utils \
            elfutils \
            flatpak \
            flatpak-builder

      # Install the exact runtime family declared by the committed manifest
      # under the current runner account so the shared package builder can use
      # Flatpak's per-user runtime and repository state
      - name: Install Flatpak Runtime and SDK
        run: |
          set -euxo pipefail

          flatpak remote-add \
            --user \
            --if-not-exists \
            flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

          flatpak install \
            --user \
            --noninteractive \
            -y \
            flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      # Regenerate cargo-sources.json from the generated Cargo.lock so the
      # offline Flatpak build always matches the committed lockfile
      - name: Set Up Python for the Cargo Sources Generator
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Cargo Sources Generator Dependencies
        run: pip install "aiohttp==3.14.2" "tomlkit==0.15.1" "PyYAML==6.0.3"

      # The shared builder validates metadata, performs the offline Rust
      # build, exports the stable application ref, and creates its checksum
      - name: Build Davenstein x86_64 Flatpak
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
          FLATPAK_ARCH: x86_64
        run: packaging/flatpak/build-package.sh

      - name: Validate Linux x86_64 Flatpak
        shell: bash
        run: |
          set -euxo pipefail

          app_id="io.github.ophois47.davenstein"

          flatpak_file=$(find target/flatpak \
            -maxdepth 1 \
            -type f \
            -name 'Davenstein-*-linux-x86_64.flatpak' \
            -print \
            -quit)

          test -n "$flatpak_file"
          test -f "$flatpak_file.sha256"

          # Verify the basename-only checksum from the artifact directory
          (
            cd "$(dirname "$flatpak_file")"
            sha256sum --check "$(basename "$flatpak_file.sha256")"
          )

          # Install the exact single-file bundle that will be published rather
          # than testing only the temporary repository used during construction
          flatpak install \
            --user \
            --noninteractive \
            -y \
            "$flatpak_file"

          flatpak list \
            --user \
            --app \
            --columns=application,arch,branch |
            grep -Eq "^${app_id}[[:space:]]+x86_64[[:space:]]+stable$"

          # Confirm the application retained its deliberately narrow sandbox
          # permissions without network or host filesystem access
          permissions=$(flatpak info \
            --user \
            --show-permissions \
            "$app_id")

          printf '%s\n' "$permissions"

          printf '%s\n' "$permissions" | grep -Fq 'shared=ipc;'
          printf '%s\n' "$permissions" | grep -Eq '(^|[=;])x11;'
          printf '%s\n' "$permissions" | grep -Fq 'wayland'
          printf '%s\n' "$permissions" | grep -Fq 'pulseaudio'
          printf '%s\n' "$permissions" | grep -Eq '(^|[=;])fallback-x11;'
          printf '%s\n' "$permissions" | grep -Fq 'devices=dri;'

          if printf '%s\n' "$permissions" | grep -Eq 'network|filesystem'
          then
            echo "Flatpak received an unexpected broad sandbox permission" >&2
            exit 1
          fi

          # Inspect installed files without launching the graphical game because
          # GitHub-hosted runners do not provide a supported desktop test session
          flatpak run \
            --command=sh \
            "$app_id" \
            -c '
              test -x /app/bin/Davenstein
              test -s /app/bin/assets.pak
              test -f /app/share/applications/io.github.ophois47.davenstein.desktop
              test -f /app/share/icons/hicolor/256x256/apps/io.github.ophois47.davenstein.png
              test -f /app/share/metainfo/io.github.ophois47.davenstein.metainfo.xml
              test -f /app/share/doc/io.github.ophois47.davenstein/README.md
              test -f /app/share/licenses/io.github.ophois47.davenstein/LICENSE.md
              test -f /app/share/licenses/io.github.ophois47.davenstein/LICENSE-MIT
              test -f /app/share/licenses/io.github.ophois47.davenstein/LICENSE-APACHE
              test -f /app/share/licenses/io.github.ophois47.davenstein/COPYRIGHT.md
              test -f /app/share/licenses/io.github.ophois47.davenstein/THIRD_PARTY_ASSETS.md
            '

          flatpak uninstall \
            --user \
            --noninteractive \
            -y \
            "$app_id//stable"

      - name: Stage Linux x86_64 Flatpak Package
        run: |
          rm -rf target/release-artifacts/linux-flatpak
          mkdir -p target/release-artifacts/linux-flatpak

          cp \
            target/flatpak/Davenstein-*-linux-x86_64.flatpak \
            target/release-artifacts/linux-flatpak/

          cp \
            target/flatpak/Davenstein-*-linux-x86_64.flatpak.sha256 \
            target/release-artifacts/linux-flatpak/

      - name: Upload Linux x86_64 Flatpak Package
        uses: actions/upload-artifact@v7
        with:
          name: Davenstein-Linux-x86_64-Flatpak-Packages
          path: target/release-artifacts/linux-flatpak/*
          if-no-files-found: error

  # Cross-compile on an x86_64 GitHub runner so Cargo build scripts run natively
  # Install and validate the i386 Bevy platform libraries through the target
  # preparation script before building the 32-bit portable archive
  build-linux-i686:
    name: Build Linux i686 Portable Archive
    if: github.event_name == 'push' || inputs.build_target == 'all' || inputs.build_target == 'linux-i686'
    needs: release-preflight
    runs-on: ubuntu-22.04
    env:
      RELEASE_VERSION: ${{ needs.release-preflight.outputs.release_version }}

    steps:
      - name: Check Out Source
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Install Validation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            file

      - name: Build Davenstein for Linux i686
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          cross build \
            --release \
            --target i686-unknown-linux-gnu \
            --features software_render \
            --bin Davenstein

      - name: Validate Linux i686 Executable
        shell: bash
        run: |
          # Verify the ELF class, byte order, machine, dynamic loader, and
          # runtime libraries instead of trusting only the Rust target name
          binary=target/i686-unknown-linux-gnu/release/Davenstein

          test -x "$binary"

          file "$binary" |
            tee "$RUNNER_TEMP/davenstein-i686-file.txt"

          grep -Eiq \
            'ELF 32-bit.*Intel 80386' \
            "$RUNNER_TEMP/davenstein-i686-file.txt"

          readelf -h "$binary" |
            tee "$RUNNER_TEMP/davenstein-i686-elf-header.txt"

          grep -Eq \
            'Class:[[:space:]]+ELF32' \
            "$RUNNER_TEMP/davenstein-i686-elf-header.txt"

          grep -Eq \
            "Data:[[:space:]]+2's complement, little endian" \
            "$RUNNER_TEMP/davenstein-i686-elf-header.txt"

          grep -Eq \
            'Machine:[[:space:]]+Intel 80386' \
            "$RUNNER_TEMP/davenstein-i686-elf-header.txt"

          readelf -l "$binary" |
            tee "$RUNNER_TEMP/davenstein-i686-program-headers.txt"

          grep -Fq \
            '/lib/ld-linux.so.2' \
            "$RUNNER_TEMP/davenstein-i686-program-headers.txt"

          readelf -d "$binary" |
            tee "$RUNNER_TEMP/davenstein-i686-dynamic.txt"

          for library in \
            libwayland-client.so.0 \
            libudev.so.1 \
            libasound.so.2 \
            libgcc_s.so.1 \
            libm.so.6 \
            libc.so.6
          do
            grep -Fq \
              "Shared library: [$library]" \
              "$RUNNER_TEMP/davenstein-i686-dynamic.txt"
          done

      - name: Build Asset Packer
        run: |
          mkdir -p target/release
          rustc --edition=2024 -O \
            src/pak_builder.rs \
            -o target/release/pak_builder

      - name: Build Assets
        run: |
          ./target/release/pak_builder \
            --root assets \
            --out target/release/assets.pak

      - name: Build Linux i686 Portable Archive
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
          ARCH: i686
          BINARY_PATH: ${{ github.workspace }}/target/i686-unknown-linux-gnu/release/Davenstein
        run: packaging/linux/build-portable.sh

      - name: Validate Linux i686 Portable Archive
        shell: bash
        run: |
          archive=$(find target/portable \
            -maxdepth 1 \
            -type f \
            -name 'Davenstein-*-linux-i686.tar.gz' \
            -print \
            -quit)

          test -n "$archive"
          test -f "$archive.sha256"

          (
            cd target/portable
            sha256sum --check "$(basename "$archive.sha256")"
          )

          extract_dir="$RUNNER_TEMP/davenstein-linux-i686"

          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"

          tar -xzf "$archive" -C "$extract_dir"

          package_root=$(find "$extract_dir" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -print \
            -quit)

          test -n "$package_root"

          for name in \
            Davenstein \
            assets.pak \
            README.md \
            LICENSE.md \
            LICENSE-MIT \
            LICENSE-APACHE \
            COPYRIGHT.md \
            THIRD_PARTY_ASSETS.md \
            davenstein.png \
            portable.flag \
            run-davenstein.sh
          do
            test -e "$package_root/$name"
          done

          test -x "$package_root/Davenstein"
          test -x "$package_root/run-davenstein.sh"
          test -s "$package_root/assets.pak"

          # Revalidate the extracted executable so the uploaded archive retains
          # the complete 32-bit x86 ABI and loader proven before packaging
          file "$package_root/Davenstein"
          file "$package_root/Davenstein" |
            grep -Eiq 'ELF 32-bit.*Intel 80386'

          readelf -h "$package_root/Davenstein" |
            tee "$RUNNER_TEMP/davenstein-i686-archive-header.txt"

          grep -Eq \
            'Class:[[:space:]]+ELF32' \
            "$RUNNER_TEMP/davenstein-i686-archive-header.txt"

          grep -Eq \
            "Data:[[:space:]]+2's complement, little endian" \
            "$RUNNER_TEMP/davenstein-i686-archive-header.txt"

          grep -Eq \
            'Machine:[[:space:]]+Intel 80386' \
            "$RUNNER_TEMP/davenstein-i686-archive-header.txt"

          readelf -l "$package_root/Davenstein" |
            grep -Fq '/lib/ld-linux.so.2'

      - name: Stage Linux i686 Release Packages
        run: |
          rm -rf target/release-artifacts/linux-i686
          mkdir -p target/release-artifacts/linux-i686

          cp \
            target/portable/Davenstein-*-linux-i686.tar.gz \
            target/release-artifacts/linux-i686/

          cp \
            target/portable/Davenstein-*-linux-i686.tar.gz.sha256 \
            target/release-artifacts/linux-i686/

      - name: Upload Linux i686 Packages
        uses: actions/upload-artifact@v7
        with:
          name: Davenstein-Linux-i686-Packages
          path: target/release-artifacts/linux-i686/*
          if-no-files-found: error

