name: Validate Davenstein Linux RISC-V 64 Build

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CROSS_VERSION: 0.2.5
  RISCV64_RUST_TARGET: riscv64gc-unknown-linux-gnu

permissions:
  contents: read

jobs:
  build-linux-riscv64:
    name: Build Linux RISC-V 64 Executable
    runs-on: ubuntu-22.04

    steps:
      - name: Check Out Source
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Cross
        run: cargo install cross --version "$CROSS_VERSION" --locked

      - name: Install Validation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            file

      # Keep this proof isolated from release.yml until the complete Davenstein
      # dependency graph produces a validated RISC-V executable
      - name: Build Davenstein for Linux RISC-V 64
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          cross build \
            --release \
            --target "$RISCV64_RUST_TARGET" \
            --features software_render \
            --bin Davenstein

      - name: Validate Linux RISC-V 64 Executable
        shell: bash
        run: |
          binary="target/$RISCV64_RUST_TARGET/release/Davenstein"

          test -x "$binary"

          file "$binary" |
            tee "$RUNNER_TEMP/davenstein-riscv64-file.txt"

          grep -Eiq \
            'ELF 64-bit.*RISC-V' \
            "$RUNNER_TEMP/davenstein-riscv64-file.txt"

          readelf -h "$binary" |
            tee "$RUNNER_TEMP/davenstein-riscv64-elf-header.txt"

          grep -Eq \
            'Class:[[:space:]]+ELF64' \
            "$RUNNER_TEMP/davenstein-riscv64-elf-header.txt"

          grep -Eq \
            'Machine:[[:space:]]+RISC-V' \
            "$RUNNER_TEMP/davenstein-riscv64-elf-header.txt"

          grep -Eq \
            'Flags:.*RVC.*double-float ABI' \
            "$RUNNER_TEMP/davenstein-riscv64-elf-header.txt"

          readelf -l "$binary" |
            tee "$RUNNER_TEMP/davenstein-riscv64-program-headers.txt"

          grep -Fq \
            '/lib/ld-linux-riscv64-lp64d.so.1' \
            "$RUNNER_TEMP/davenstein-riscv64-program-headers.txt"

      - name: Stage Linux RISC-V 64 Proof
        shell: bash
        run: |
          binary="target/$RISCV64_RUST_TARGET/release/Davenstein"
          proof_dir="target/riscv64-proof"

          rm -rf "$proof_dir"
          mkdir -p "$proof_dir"

          cp "$binary" "$proof_dir/Davenstein"
          cp \
            "$RUNNER_TEMP/davenstein-riscv64-file.txt" \
            "$RUNNER_TEMP/davenstein-riscv64-elf-header.txt" \
            "$RUNNER_TEMP/davenstein-riscv64-program-headers.txt" \
            "$proof_dir/"

          sha256sum "$proof_dir/Davenstein" \
            > "$proof_dir/Davenstein.sha256"

      - name: Upload Linux RISC-V 64 Proof
        uses: actions/upload-artifact@v7
        with:
          name: Davenstein-Linux-RISC-V-64-Proof
          path: target/riscv64-proof/*
          if-no-files-found: error
